<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>PUB GURU | Historie faktur</title><link rel="stylesheet" href="v1.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="app-config.js"></script><script defer src="backend.js"></script><script defer src="invoice-history.js?v=20260902"></script><style>.shell{max-width:980px;margin:0 auto;padding:20px 16px 90px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head a{color:var(--text);text-decoration:none}.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:16px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.summary .box{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2)}.summary strong{display:block;font-size:24px}.invoice-row{display:grid;grid-template-columns:2fr 1.2fr 110px 140px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.invoice-row small{display:block;color:var(--muted);margin-top:3px}.amount{text-align:right;font-weight:800;font-size:18px}.pay{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:12px}.empty{color:var(--muted);padding:20px 0}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters label:nth-child(3),.filters label:nth-child(4),.filters label:nth-child(5){grid-column:1/-1}.invoice-row{grid-template-columns:1fr auto}.invoice-row>div:nth-child(2),.invoice-row>div:nth-child(3){grid-column:1/-1}.amount{grid-column:2;grid-row:1;text-align:right}}</style></head><body><main class="shell"><header class="head"><div><a href="start.html">← PUB GURU</a><h1 style="margin:10px 0 4px">Historie faktur</h1><p>Vyhledej zaplacené doklady podle období a způsobu úhrady.</p></div><span id="roleBadge" class="badge muted">ověřuji…</span></header><section class="panel" style="margin-top:16px"><div class="filters"><label>Od<input id="from" type="date"></label><label>Do<input id="to" type="date"></label><label>Období podle<select id="basis"><option value="issue_date">data dokladu</option><option value="paid_at">data úhrady</option></select></label><label>Úhrada<select id="method"><option value="all">Hotově + kartou</option><option value="cash">Jen hotově</option><option value="card">Jen kartou</option></select></label><label>Stav<select id="status"><option value="paid">Zaplacené</option><option value="unpaid">Nezaplacené</option><option value="all">Všechny</option></select></label></div><button id="refreshBtn" class="btn btn-primary" style="margin-top:12px">Načíst</button><div class="summary"><div class="box"><small>Počet faktur</small><strong id="count">0</strong></div><div class="box"><small>Celkem s DPH</small><strong id="sum">0 Kč</strong></div></div><div id="results"></div></section></main><div id="toast" class="toast hidden"></div></body></html>
