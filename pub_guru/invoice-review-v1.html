<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>PUB GURU | Faktury ke schválení</title><link rel="stylesheet" href="v1.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="app-config.js"></script><script defer src="backend.js"></script><script defer src="invoice-review.js"></script><style>.review-shell{max-width:1180px;margin:0 auto;padding:20px 16px 90px}.review-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.review-head a{color:var(--text);text-decoration:none}.review-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px}.queue{display:grid;gap:10px}.queue-item{width:100%;text-align:left;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);color:var(--text)}.queue-item.active{outline:2px solid var(--accent)}.queue-item small{display:block;color:var(--muted);margin-top:4px}.review-line{display:grid;grid-template-columns:minmax(170px,2fr) minmax(170px,2fr) 95px 115px 120px 110px;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}.review-line label{font-size:11px}.ocr-box{white-space:pre-wrap;max-height:220px;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);font-size:12px}.empty{color:var(--muted);padding:18px 0}.sticky-post{position:sticky;bottom:10px;background:var(--panel);padding-top:12px}.hidden{display:none!important}@media(max-width:820px){.review-grid{grid-template-columns:1fr}.review-line{grid-template-columns:1fr 1fr}.review-line .raw,.review-line .product{grid-column:1/-1}}</style></head><body><main class="review-shell"><header class="review-head"><div><a href="start.html">← PUB GURU</a><h1 style="margin:10px 0 4px">Faktury ke schválení</h1><p>Vedoucí nebo majitel potvrdí párování. Teprve potom vznikne příjem skladu.</p></div><span id="roleBadge" class="badge muted">ověřuji roli…</span></header><div class="review-grid"><section class="panel"><div class="panel-head"><h2>Čekají</h2><span id="queueCount" class="badge muted">0</span></div><div id="queue" class="queue"></div></section><section id="editor" class="panel hidden"><div class="panel-head"><h2>Kontrola faktury</h2><span id="invoiceStatus" class="badge">review</span></div><div class="form-grid compact"><label>Dodavatel<input id="supplier"></label><label>Číslo faktury<input id="number"></label><label>Datum<input id="date" type="date"></label></div><h3>OCR text</h3><div id="rawOcr" class="ocr-box"></div><h3 style="margin-top:16px">Položky</h3><div id="lines"></div><div class="sticky-post"><button id="postBtn" class="btn btn-primary">Schválit a naskladnit</button></div></section><section id="emptyEditor" class="panel"><div class="empty">Vyber fakturu vlevo.</div></section></div></main><div id="toast" class="toast hidden"></div></body></html>
